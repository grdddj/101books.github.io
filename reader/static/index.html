<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>200 Basic Go Problems</title>
    <link rel="stylesheet" href="app.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="reader-header">
      <div class="header-content">
        <h1 id="collection-title">Go problem reader</h1>
        <p id="progress-summary" aria-live="polite"></p>
      </div>
    </header>
    <main id="app" class="reader">
      <p id="problem-ordinal" class="problem-ordinal"></p>
      <div
        id="board"
        class="goban"
        role="img"
        aria-label="Static Go board showing the current problem"
      ></div>
      <p id="status-feedback" role="status" aria-live="polite"></p>
      <nav class="reader-controls" aria-label="Problem controls">
        <button id="previous" type="button">Previous</button>
        <button id="solved" type="button" aria-pressed="false">Solved</button>
        <button id="revisit" type="button" aria-pressed="false">Revisit</button>
        <button id="next" type="button">Next</button>
      </nav>
    </main>
  </body>
</html>
