<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#e0b563">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Tsumego">
    <title>200 Basic Go Problems</title>
    <link rel="manifest" href="__READER_BASE_PATH__/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="__READER_BASE_PATH__/icons/icon-192.png">
    <link rel="apple-touch-icon" href="__READER_BASE_PATH__/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="__READER_BASE_PATH__/app.css">
    <script>window.READER_BASE_PATH = "__READER_BASE_PATH__";</script>
    <script src="__READER_BASE_PATH__/app.js" defer></script>
  </head>
  <body>
    <header class="reader-header">
      <div class="header-content">
        <div>
          <h1 id="collection-title">Go problem reader</h1>
          <p id="progress-summary" aria-live="polite"></p>
        </div>
        <button
          id="change-collection"
          type="button"
          aria-controls="collection-panel"
          aria-expanded="false"
          disabled
        >
          Change collection
        </button>
        <button
          id="show-activity"
          type="button"
          aria-controls="activity-panel"
          aria-expanded="false"
          disabled
        >
          Activity
        </button>
      </div>
    </header>
    <div id="modal-backdrop" class="modal-backdrop" aria-hidden="true" hidden></div>
    <section
      id="collection-panel"
      class="collection-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="collection-panel-title"
      hidden
    >
      <div class="collection-panel__header">
        <h2 id="collection-panel-title">Choose a collection</h2>
        <button id="close-collection-panel" type="button">Close</button>
      </div>
      <ul id="collection-list" class="collection-list" aria-label="Available collections"></ul>
    </section>
    <section
      id="activity-panel"
      class="activity-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="activity-panel-title"
      hidden
    >
      <div class="activity-panel__header">
        <h2 id="activity-panel-title">Recent activity</h2>
        <button id="close-activity-panel" type="button">Close</button>
      </div>
      <p id="activity-empty" class="activity-empty" hidden></p>
      <ol id="activity-list" class="activity-list" aria-label="Recent solved and revisit actions"></ol>
    </section>
    <main id="app" class="reader">
      <p id="problem-ordinal" class="problem-ordinal"></p>
      <div
        id="board"
        class="goban"
        role="img"
        aria-label="Static Go board showing the current problem"
      ></div>
      <p id="status-feedback" role="status" aria-live="polite"></p>
      <nav class="reader-controls" aria-label="Problem controls">
        <button id="solved" type="button" aria-pressed="false" disabled>Solved</button>
        <div class="reader-controls__secondary">
          <button id="previous" type="button" disabled>Previous</button>
          <button id="revisit" type="button" aria-pressed="false" disabled>Revisit</button>
          <button id="next" type="button" disabled>Next</button>
        </div>
      </nav>
    </main>
  </body>
</html>
